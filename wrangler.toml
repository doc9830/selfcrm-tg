# Cloudflare Worker бота @fastcrm_bot: приём обновлений Telegram через webhook.
#
# Деплой руками:        npx wrangler deploy
# Деплой автоматически: push в main → .github/workflows/deploy-worker.yml
# Локально:             npm run worker:dev
#
# Секретов в этом файле нет и быть не должно. BOT_TOKEN и WEBHOOK_SECRET задаются один раз:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
# (то же самое одной командой с машины разработчика: npm run bot:webhook:set -- --sync-secrets)
name = "selfcrm-bot"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"

# Preview-адреса версий (https://<версия>-selfcrm-bot.<поддомен>.workers.dev) для бота не нужны:
# он принимает запросы только по адресу webhook, а лишние публичные адреса — только шум.
preview_urls = false

# Адрес Mini App, который открывает кнопка бота. Это не секрет: значение видно и в Telegram.
# Оно подставляется в кнопку «Открыть SelfCRM», кнопку меню и в /help.
[vars]
WEBAPP_URL = "https://doc9830.github.io/selfcrm-tg/"

# Временные файлы мини-приложения (отчёт в Excel): Workers KV.
#
#   POST /files            — положить файл, в ответ приходит ссылка на скачивание
#   GET  /files/<id>       — скачать файл (ссылка живёт час, имя случайное)
#   POST /files/<id>/share — подготовить сообщение с файлом для «Поделиться»: Worker проверяет
#                            подпись мини-приложения и собирает сообщение ботом (worker/src/share.ts)
#
# Отдельное хранилище нужно потому, что в WebView клиента Telegram файл со страницы
# отдать нечем: страница отдаёт ссылку, а файл лежит в KV. Данных CRM здесь нет —
# только переданный файл и только до истечения срока (см. worker/src/files.ts).
#
# Привязка создаётся один раз и уже создана (npx wrangler kv namespace create REPORT_FILES).
# Если переносите проект в свой аккаунт Cloudflare — создайте своё хранилище и подставьте
# его id. Пока привязки нет, Worker отвечает 503, а приложение говорит «выгрузка не
# настроена» — деплой бота при этом не ломается.
[[kv_namespaces]]
binding = "REPORT_FILES"
id = "fba94f461ff74061befc4d98329a1ba6"

# Логи Worker: Cloudflare → Workers & Pages → selfcrm-bot → Logs.
[observability]
enabled = true

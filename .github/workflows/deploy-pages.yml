name: Deploy to GitHub Pages

# Сборка Telegram Mini App и публикация на GitHub Pages:
#   https://doc9830.github.io/selfcrm-tg/
# Адрес Mini App подставляется в бота: он хранится в переменной Worker WEBAPP_URL
# (wrangler.toml) и в кнопке меню чата. Vite собран с base: './' — относительные пути
# работают и в подкаталоге Pages, и внутри WebView Telegram.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Ключ подсказок Дадаты: хранится в секретах репозитория (Settings → Secrets and
          # variables → Actions), а не в исходниках. Если секрет не задан, переменная пустая
          # и подсказки адресов на веб-версии работают по локальной базе.
          VITE_DADATA_TOKEN: ${{ secrets.VITE_DADATA_TOKEN }}
          # Адрес Worker'а для выгрузки отчёта (POST /files). Секрета в нём нет и
          # задавать переменную не обязательно: без неё берётся адрес проекта из
          # src/telegram/files.ts. Нужна, если Worker развёрнут по другому адресу.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

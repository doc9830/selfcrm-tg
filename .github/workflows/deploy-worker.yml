name: Deploy worker

# Деплой Cloudflare Worker бота @fastcrm_bot (worker/src): Telegram присылает обновления
# в Worker по webhook, поэтому бот работает и при выключенном компьютере.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — токен с правом «Edit Cloudflare Workers» (Workers Scripts: Edit);
#   CLOUDFLARE_ACCOUNT_ID — Account ID из панели Cloudflare.
# Пока они не заданы, шаг деплоя пропускается (workflow не падает) — проверки и тесты
# всё равно выполняются. Значения секретов можно хранить и в Secrets, и в Variables: если
# токен задан, а Account ID — нет, запуск падает на шаге «Credentials: нет
# CLOUDFLARE_ACCOUNT_ID» с подсказкой, чего не хватает.
#
# Секреты самого Worker (BOT_TOKEN, WEBHOOK_SECRET) в GitHub не хранятся и в этом файле их
# нет: они задаются один раз в Cloudflare — `npx wrangler secret put BOT_TOKEN` или с машины
# разработчика `npm run bot:webhook:set -- --sync-secrets`.
#
# Mini App (GitHub Pages) собирается отдельным workflow — deploy-pages.yml.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

env:
  # Значение можно положить и в Secrets, и в Variables — читаются оба места.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      # Шаги ниже устроены так, что состояние секретов видно по названиям шагов в списке
      # запуска, без чтения логов: один шаг на каждую ситуацию.
      - name: "Credentials: нет CLOUDFLARE_API_TOKEN"
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN не задан — деплой Worker пропущен. См. README, раздел «Cloudflare: где живёт бот»."

      - name: "Credentials: нет CLOUDFLARE_ACCOUNT_ID"
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::CLOUDFLARE_ACCOUNT_ID не задан. Добавьте секрет: Settings → Secrets and variables → Actions → New repository secret, имя CLOUDFLARE_ACCOUNT_ID. Значение — Account ID из панели Cloudflare (Workers & Pages, справа)."
          exit 1

      - name: Check Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          echo "Node: $(node -v)"
          echo "wrangler: $(npx wrangler --version 2>&1 | tail -1)"
          echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
          if npx wrangler whoami 2>&1 | tee /tmp/whoami.log; then
            echo "whoami: ок"
          else
            # Текст ошибки дублируем в аннотацию: она видна в списке запуска и через API,
            # даже когда логи недоступны. Значения секретов GitHub маскирует сам.
            echo "::error::wrangler whoami упал: $(tail -6 /tmp/whoami.log | tr '\n' ' ' | sed 's/%/%25/g' | sed 's/::/-/g')"
            exit 1
          fi

      - name: Deploy Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          if npx wrangler deploy 2>&1 | tee /tmp/deploy.log; then
            echo "Деплой Worker прошёл"
          else
            echo "::error::wrangler deploy упал: $(tail -8 /tmp/deploy.log | tr '\n' ' ' | sed 's/%/%25/g' | sed 's/::/-/g')"
            exit 1
          fi

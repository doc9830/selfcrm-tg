name: Deploy worker

# Деплой Cloudflare Worker бота @fastcrm_bot (worker/src): Telegram присылает обновления
# в Worker по webhook, поэтому бот работает и при выключенном компьютере.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — токен с правом «Edit Cloudflare Workers» (Workers Scripts: Edit);
#   CLOUDFLARE_ACCOUNT_ID — Account ID из панели Cloudflare.
# Пока они не заданы, шаг деплоя пропускается (workflow не падает) — проверки и тесты
# всё равно выполняются. Если токен задан, а Account ID нет или значения неверные, шаг
# «Check Cloudflare credentials» печатает причину до попытки деплоя.
#
# Секреты самого Worker (BOT_TOKEN, WEBHOOK_SECRET) в GitHub не хранятся и в этом файле их
# нет: они задаются один раз в Cloudflare — `npx wrangler secret put BOT_TOKEN` или с машины
# разработчика `npm run bot:webhook:set -- --sync-secrets`.
#
# Mini App (GitHub Pages) собирается отдельным workflow — deploy-pages.yml.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Check Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Секрет CLOUDFLARE_ACCOUNT_ID не задан. Account ID виден в панели Cloudflare → Workers & Pages (справа). См. README, раздел «Cloudflare: где живёт бот»."
            exit 1
          fi
          echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
          npx wrangler whoami

      - name: Deploy Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Cloudflare secrets are not set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN не задан — деплой Worker пропущен. См. README, раздел «Cloudflare»."
